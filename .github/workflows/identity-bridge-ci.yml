name: Identity bridge checks

on:
  pull_request:
    paths:
      - 'identity-bridge/**'
      - '.github/workflows/identity-bridge-ci.yml'
  push:
    branches: ['codex/mirror-identity-migration']
    paths:
      - 'identity-bridge/**'
      - '.github/workflows/identity-bridge-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: identity-bridge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: identity-bridge/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
