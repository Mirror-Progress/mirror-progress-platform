services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: mirror_identity_synthetic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - identity-synthetic-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mirror_identity_synthetic"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  identity-synthetic-pg:
